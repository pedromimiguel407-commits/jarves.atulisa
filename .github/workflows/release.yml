name: JARVES v2.3.9 Release
on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - ".github/workflows/release.yml"
      - "android/**"
      - "backend/**"
      - "desktop/**"
      - "frontend/**"
      - "scripts/**"
      - "requirements.txt"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Verify version
        run: |
          node -e "if(require('./package.json').version !== '2.3.9') process.exit(1)"
          grep -q "versionName '2.3.9'" android/app/build.gradle
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build APK
        run: gradle --no-daemon -p android assembleDebug
      - name: Launch APK on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            adb logcat -c
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.jarves.ai/.DefaultLauncher
            sleep 8
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" | grep -q "com.jarves.ai"
            if adb logcat -d | grep -E "FATAL EXCEPTION|Process: com.jarves.ai.*has died"; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: JARVES-Android-APK-v2.3.9
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: windows }
          - { os: ubuntu-24.04, target: linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.13.0", cache: npm }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt pyinstaller
          npm ci
          node -e "if(require('./package.json').version !== '2.3.9') process.exit(1)"
      - name: Package Python backend (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name JARVESBackend --paths . --collect-all fastapi --collect-all starlette --collect-all pydantic --collect-all uvicorn --collect-all pypdf --collect-all multipart --add-data "frontend;frontend" --add-data "JARVES_UNIVERSAL_ERROR_ENGINE;JARVES_UNIVERSAL_ERROR_ENGINE" scripts/backend_entry.py
          New-Item -ItemType Directory -Force build/backend | Out-Null
          Copy-Item dist/JARVESBackend.exe build/backend/JARVESBackend.exe
      - name: Package Python backend (Linux)
        if: matrix.target == 'linux'
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name JARVESBackend --paths . --collect-all fastapi --collect-all starlette --collect-all pydantic --collect-all uvicorn --collect-all pypdf --collect-all multipart --add-data "frontend:frontend" --add-data "JARVES_UNIVERSAL_ERROR_ENGINE:JARVES_UNIVERSAL_ERROR_ENGINE" scripts/backend_entry.py
          mkdir -p build/backend
          cp dist/JARVESBackend build/backend/JARVESBackend
      - name: Build Windows installer
        if: matrix.target == 'windows'
        run: npm run build:windows
      - name: Verify Windows EXE and SHA-256
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter '*.exe' -File | Select-Object -First 1
          if (-not $installer -or $installer.Length -lt 50000000) { throw 'EXE ausente ou incompleto.' }
          $stream = [System.IO.File]::OpenRead($installer.FullName)
          try {
            $reader = [System.IO.BinaryReader]::new($stream)
            if ([System.Text.Encoding]::ASCII.GetString($reader.ReadBytes(2)) -ne 'MZ') { throw 'Assinatura DOS inválida.' }
            $stream.Position = 60
            $offset = $reader.ReadInt32()
            if ($offset -lt 64 -or $offset -gt ($stream.Length - 4)) { throw 'Offset PE inválido.' }
            $stream.Position = $offset
            if ([System.Text.Encoding]::ASCII.GetString($reader.ReadBytes(4)) -ne "PE`0`0") { throw 'Assinatura PE inválida.' }
          } finally { $stream.Dispose() }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash
          Set-Content "$($installer.FullName).sha256" "$hash  $($installer.Name)" -Encoding ascii
      - name: Build Linux AppImage
        if: matrix.target == 'linux'
        run: npm run build:linux
      - name: Smoke test Linux AppImage and API
        if: matrix.target == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y xvfb
          APPIMAGE="$(find dist -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$APPIMAGE" && chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract >/tmp/jarves-extract.log 2>&1
          test -x squashfs-root/AppRun
          xvfb-run -a env ELECTRON_DISABLE_GPU=1 ./squashfs-root/AppRun --no-sandbox >/tmp/jarves-smoke.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true; pkill -f "[J]ARVESBackend" 2>/dev/null || true' EXIT
          PORT=""
          for attempt in $(seq 1 60); do
            PORT="$(sed -n 's/.*Uvicorn running on http:\/\/127\.0\.0\.1:\([0-9][0-9]*\).*/\1/p' /tmp/jarves-smoke.log | head -n 1)"
            if [ -n "$PORT" ]; then break; fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then cat /tmp/jarves-smoke.log; exit 1; fi
            sleep 1
          done
          test -n "$PORT" || { cat /tmp/jarves-smoke.log; exit 1; }
          curl --fail --silent --show-error "http://127.0.0.1:$PORT/api/health" -o /tmp/jarves-health.json
          python -c "import json; d=json.load(open('/tmp/jarves-health.json')); assert d.get('status')=='ok' and d.get('version')=='2.3.9', d; print('AppImage + API OK:', d)"
          kill -0 "$APP_PID"
      - name: Upload Windows installer
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: JARVES-Windows-EXE-v2.3.9
          path: |
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error
          retention-days: 90
      - name: Upload Linux AppImage
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: JARVES-Linux-AppImage-v2.3.9
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 90
  publish:
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: JARVES-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.3.9
          name: JARVES AI v2.3.9
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: release-assets/**/*
          body: |
            JARVES AI v2.3.9.
            APK debug: compilado e testado em emulador Android 15.
            Linux AppImage: inicialização e endpoint de saúde da API embutida verificados.
            Windows EXE x64: cabeçalho PE e SHA-256 verificados.
            O APK não é assinado para Play Store; EXE sem Authenticode pode exibir aviso SmartScreen. Testes em emulador não substituem teste físico.
